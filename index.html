<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plyvoro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08111f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 18px 20px;
      background: #0d1b2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #24364d;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .login-btn {
      background: #1677ff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .hero {
      padding: 35px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aebbc9;
      font-size: 15px;
    }

    .wallet {
      margin: 0 20px 30px;
      padding: 20px;
      background: #10263a;
      border-radius: 14px;
      text-align: center;
      border: 1px solid #29445f;
    }

    .wallet-title {
      color: #aebbc9;
      font-size: 14px;
    }

    .coins {
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }

    .games {
      padding: 10px 20px 40px;
      max-width: 700px;
      margin: auto;
    }

    .games h2 {
      margin-bottom: 18px;
      font-size: 22px;
    }

    .game-card {
      background: #101f33;
      border: 1px solid #263b55;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .game-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .game-card h3 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .game-card p {
      color: #aebbc9;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .play-btn {
      width: 100%;
      border: none;
      background: #1677ff;
      color: white;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #718096;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Plyvoro</div>
    <button class="login-btn">Login</button>
  </header>

  <section class="hero">
    <h1>Welcome to Plyvoro</h1>
    <p>Play games using virtual coins.</p>
  </section>

  <div class="wallet">
    <div class="wallet-title">Virtual Coin Balance</div>
    <div class="coins">🪙 10,000 Coins</div>
  </div>

  <section class="games">
    <h2>🎮 Games</h2>

    <div class="game-card">
      <div class="game-icon">🏏</div>
      <h3>Cricket Prediction</h3>
      <p>Make predictions about cricket matches using virtual coins.</p>
      <button class="play-btn">Play Now</button>
    </div>

    <div class="game-card">
      <div class="game-icon">🚀</div>
      <h3>Crash</h3>
      <p>Play the virtual crash game using virtual coins.</p>
      <button class="play-btn">Play Now</button>
    </div>

  </section>

  <footer>
    © 2026 Plyvoro • Virtual Coins Only
  </footer>

</body>
</html>
